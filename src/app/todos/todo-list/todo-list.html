<div class="todo-container">
  <h1>Todo List</h1>

  @if (loading()) {
    <div>Loading todos...</div>
  } @else {
    @for (todo of todos(); track todo.id) {
      <app-todo-item
        [todo]="todo"
        (toggleComplete)="onToggleComplete($event)"
        (deleteTodo)="onDeleteTodo($event)"
        class="todo-item"
      ></app-todo-item>
    } @empty {
      <p>No todos left.</p>
    }
  }
</div>
