<form class="todo-form" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline" class="todo-input">
    <mat-label>New todo</mat-label>
    <input matInput [ngModel]="title()" (ngModelChange)="title.set($event)" name="title" />
  </mat-form-field>

  <button mat-mini-fab color="primary" type="submit" aria-label="Add todo">
    <mat-icon>add</mat-icon>
  </button>
</form>
