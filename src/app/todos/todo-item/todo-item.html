<mat-card class="todo-card">
  <mat-checkbox
    class="todo-checkbox"
    [checked]="todo().completed"
    (change)="onToggle()"
    color="primary"
  >
    <span [class.completed-text]="todo().completed">{{ todo().title }}</span>
  </mat-checkbox>

  <button mat-icon-button color="warn" (click)="onDelete()">
    <mat-icon>delete</mat-icon>
  </button>
</mat-card>
